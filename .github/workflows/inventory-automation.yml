name: Inventory automation tests

on:
  push:
    paths:
      - "inventory-automation/**"
      - ".github/workflows/inventory-automation.yml"
  pull_request:
    paths:
      - "inventory-automation/**"
      - ".github/workflows/inventory-automation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: inventory-automation/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
